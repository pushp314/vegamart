# ==============================================================================
# Gali Connect — Nginx reverse proxy (HTTPS) for the Node.js backend
# ==============================================================================
# Place this in /etc/nginx/sites-available/gali-connect and symlink to
# /etc/nginx/sites-enabled/. Adjust `your-domain.com` and the SSL cert paths.
# ==============================================================================

upstream gali_connect_backend {
    # Use a Unix socket or TCP; TCP shown here. PM2 cluster listens on 8080.
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client request body limit (matches Express json limit of 2mb + uploads)
    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;

    # Rate limiting (shared zone: 10 req/s per IP, burst 20)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://gali_connect_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Socket.IO / WebSocket streaming for live order tracking
        proxy_buffering off;
    }

    # Health check (unauthenticated)
    location = /api/v1/health {
        proxy_pass http://gali_connect_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger docs
    location = /api/v1/docs {
        return 301 /api/v1/docs/;
    }
    location /api/v1/docs/ {
        proxy_pass http://gali_connect_backend;
        proxy_set_header Host $host;
    }

    # Frontend static assets (if served from this machine)
    location / {
        proxy_pass http://127.0.0.1:3000; # Vite/React dev or built SPA server
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
